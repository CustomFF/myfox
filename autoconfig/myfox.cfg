// MyFox autoconfig: privileged JS that Firefox runs on every startup
// (enabled by defaults/pref/autoconfig.js). It only checks the profile and
// loads the modules from <install>/myfox/; the tweaks live there.
try {
  let { classes: Cc, interfaces: Ci } = Components;
  let sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  let ios = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  let ds = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
  let os = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  let wm = Cc["@mozilla.org/appshell/window-mediator;1"].getService(Ci.nsIWindowMediator);
  let prefs = Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefService).getBranch("");

  // Tweaks apply only to profiles the installer marked (.myfox, written by
  // apply_chrome). Any other profile stays stock Firefox: the throw below
  // stops everything after it.
  let profileDir = ds.get("ProfD", Ci.nsIFile);
  let marker = profileDir.clone();
  marker.append(".myfox");
  if (!marker.exists()) {
    throw new Error("Not a myfox profile; skip tweaks");
  }

  // The context every module receives (see myfox/00-common.js).
  globalThis.MyFox = { Cc, Ci, sss, ios, ds, os, wm, prefs, profileDir };

  // Modules: every <install>/myfox/*.js, in file-name order (the numeric
  // prefixes fix the load order). They are loaded into this global through
  // resource://myfox/ — the script loader refuses file:// URIs. A module that
  // fails to load is logged and skipped; the others still run.
  let modDir = ds.get("GreD", Ci.nsIFile);
  modDir.append("myfox");
  globalThis.MyFox.modDir = modDir;
  if (modDir.exists() && modDir.isDirectory()) {
    ios.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
      .setSubstitution("myfox", ios.newFileURI(modDir));
    let loader = Cc["@mozilla.org/moz/jssubscript-loader;1"].getService(Ci.mozIJSSubScriptLoader);
    let log = Cc["@mozilla.org/consoleservice;1"].getService(Ci.nsIConsoleService);
    let names = [];
    let entries = modDir.directoryEntries;
    while (entries.hasMoreElements()) {
      let f = entries.getNext().QueryInterface(Ci.nsIFile);
      if (f.leafName.endsWith(".js")) names.push(f.leafName);
    }
    names.sort();
    for (let name of names) {
      try {
        loader.loadSubScript("resource://myfox/" + name, globalThis);
      } catch(e) {
        log.logStringMessage("MyFox: module " + name + " failed: " + e);
      }
    }
  }
} catch(e) {}
