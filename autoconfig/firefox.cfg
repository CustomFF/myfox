// MyFox autoconfig: privileged JS that Firefox runs on every startup.
// Everything below the profile guard applies only to the profile the
// installer marked (see lib/apply.sh, apply_chrome).
try {
  let { classes: Cc, interfaces: Ci } = Components;
  let sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  let ios = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  let ds = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
  let os = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  let wm = Cc["@mozilla.org/appshell/window-mediator;1"].getService(Ci.nsIWindowMediator);
  let prefs = Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefService).getBranch("");

  // Tweaks apply only to profiles the installer marked (.myfox, written by
  // apply_chrome). Any other profile stays stock Firefox: the throw below
  // stops everything after it.
  let profileDir = ds.get("ProfD", Ci.nsIFile);
  let marker = profileDir.clone();
  marker.append(".myfox");
  if (!marker.exists()) {
    throw new Error("Not a myfox profile; skip tweaks");
  }

  // ── Constants ──────────────────────────────────────────────────────────
  // Theme add-on IDs (AMO google-chrome-dark / google-chrome-light); the
  // installer puts both .xpi files into <profile>/extensions/.
  const THEME_IDS = {
    dark: "{9631ec37-35f2-4719-815e-2f84ff28b901}",
    light: "{1fd1213e-dcb2-48d9-806f-c0a8a7d0a8e7}",
  };
  // Bookmarks-toolbar entries. chrome/user/10-menus-bookmarks.css matches
  // them by these exact Russian titles (icon-only styling).
  const BOOKMARK_ADVANCED_TITLE = "Расширенные настройки";
  const BOOKMARK_GALLERY_TITLE = "Добавить букмарклеты";
  // The bookmarklet gallery (ddblm) picks its language from ?lang=.
  const GALLERY_URL = "https://daydve.github.io/ddblm/";
  // Password-card height the megalist virtual list assumes; must match the
  // 132px card step in chrome/agent/60-password-manager.css.
  const MEGALIST_CARD_HEIGHT = 132;
  const MEGALIST_ALERT_EXTRA_HEIGHT = 51;
  // Sidebar panels Firefox doesn't ship. `name` is the id in the
  // sidebar.main.tools pref; the ru/en pair is the title and launcher tooltip.
  const EXTRA_SIDEBARS = [
    {
      view: "viewDownloadsSidebar", name: "downloads", url: "about:downloads",
      icon: "chrome://browser/skin/downloads/downloads.svg", l10nId: "navbar-downloads",
      title: ["Загрузки", "Downloads"],
    },
    {
      view: "viewAddonsSidebar", name: "addons", url: "about:blank?myfox-addons",
      icon: "chrome://mozapps/skin/extensions/extension.svg", l10nId: "",
      title: ["Расширения", "Extensions"],
    },
  ];

  // Sideloaded add-ons (<profile>/extensions/*.xpi) are installed disabled
  // by default (extensions.autoDisableScopes=15) and flagged in about:addons.
  // Allow silent activation (MDN, "Add-ons in the enterprise"): only this
  // profile has our .xpi files, so nothing is enabled anywhere else.
  try {
    defaultPref("extensions.autoDisableScopes", 0);
    defaultPref("extensions.enabledScopes", 15);
    // The profile button (fxa-toolbar-menu-button) is drawn only while the
    // window carries the fxatoolbarmenu attribute (driven by this pref).
    // Hidden by default; a user-pref can bring it back. Removing the widget
    // doesn't help: it returns from the saved placements.
    defaultPref("identity.fxaccounts.toolbar.enabled", false);
  } catch(e) {}

  // ── Helpers ────────────────────────────────────────────────────────────
  function hasRussianLocale(doc) {
    return !!(doc.documentElement.lang && doc.documentElement.lang.startsWith("ru"));
  }

  // Picks the Russian or English string by the document's language.
  function tr(doc, ru, en) {
    return hasRussianLocale(doc) ? ru : en;
  }

  // Runs fn once per profile: the guard pref is set before fn runs, so a
  // failure halfway never retries on the next startup. Anything the user can
  // change in Firefox's own settings belongs behind one of these — it must
  // never be re-applied over their choice.
  function oncePerProfile(guardPref, fn) {
    try {
      if (prefs.getBoolPref(guardPref, false)) return;
      prefs.setBoolPref(guardPref, true);
      fn();
    } catch(e) {}
  }

  // Calls callback once the browser window has finished delayed startup.
  function whenDelayedStartupDone(win, callback) {
    if (win.gBrowserInit && win.gBrowserInit.delayedStartupFinished) {
      callback();
      return;
    }
    let listener = {
      observe(subject, topic) {
        if (topic === "browser-delayed-startup-finished" && subject === win) {
          try { os.removeObserver(listener, topic); } catch(e) {}
          callback();
        }
      }
    };
    try {
      os.addObserver(listener, "browser-delayed-startup-finished", false);
    } catch(e) {
      win.addEventListener("load", function onLoad() {
        win.removeEventListener("load", onLoad);
        callback();
      });
    }
  }

  function runOnDOMContentLoaded(win, callback) {
    if (win.document && win.document.readyState !== "loading") {
      try { callback(); } catch(e) {}
    } else {
      win.addEventListener("DOMContentLoaded", function onDom() {
        try {
          win.removeEventListener("DOMContentLoaded", onDom);
          callback();
        } catch(e) {}
      });
    }
  }

  function notifyLayoutChange() {
    let wins = wm.getEnumerator("navigator:browser");
    while (wins.hasMoreElements()) {
      try {
        let w = wins.getNext();
        w.dispatchEvent(new w.CustomEvent("sidebar-layout-change"));
      } catch(e) {}
    }
  }

  // Agent sheets: every chrome/agent/*.css, in file-name order (the numeric
  // prefixes fix the cascade order). Agent origin is what reaches into shadow
  // DOM and beats the documents' own styles; userChrome.css can't.
  let agentDir = profileDir.clone();
  agentDir.append("chrome");
  agentDir.append("agent");
  if (agentDir.exists() && agentDir.isDirectory()) {
    let agentFiles = [];
    let entries = agentDir.directoryEntries;
    while (entries.hasMoreElements()) {
      let f = entries.getNext().QueryInterface(Ci.nsIFile);
      if (f.leafName.endsWith(".css")) agentFiles.push(f);
    }
    agentFiles.sort((a, b) => (a.leafName < b.leafName ? -1 : a.leafName > b.leafName ? 1 : 0));
    for (let f of agentFiles) {
      let fileURI = ios.newFileURI(f);
      if (!sss.sheetRegistered(fileURI, sss.AGENT_SHEET)) {
        sss.loadAndRegisterSheet(fileURI, sss.AGENT_SHEET);
      }
    }
  }

  function initWindow(win) {
    try {
      if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
      if (win.myLayoutObserverInitialized) return;
      win.myLayoutObserverInitialized = true;

      const doc = win.document;
      const sbCtrl = win.SidebarController;
      const CustomizableUI = win.CustomizableUI;

      // Profile-local replacement for the DisableProfileImport policy (we
      // never install policies): Firefox adds an "Import bookmarks"
      // (import-button) widget to the toolbar — catch its addition and
      // remove it right away. The profile button is hidden by the
      // identity.fxaccounts.toolbar.enabled default above.
      let myfoxHiddenWidgets = ["import-button"];
      try {
        if (!globalThis.myHiddenWidgetsListener) {
          globalThis.myHiddenWidgetsListener = {
            onWidgetAdded(widgetId) {
              if (myfoxHiddenWidgets.includes(widgetId)) {
                try { CustomizableUI.removeWidgetFromArea(widgetId); } catch(e) {}
              }
            }
          };
          CustomizableUI.addListener(globalThis.myHiddenWidgetsListener);
        }
        for (let wg of myfoxHiddenWidgets) {
          try { CustomizableUI.removeWidgetFromArea(wg); } catch(e) {}
        }
      } catch(e) {}

      // Give the extra panels' buttons in the sidebar launcher a tooltip (they
      // have no l10n label of their own here).
      function patchSidebarButtons() {
        try {
          let sidebarMain = doc.querySelector("sidebar-main");
          if (!sidebarMain || !sidebarMain.shadowRoot) return;

          let shadow = sidebarMain.shadowRoot;

          function updateAll() {
            for (let panel of EXTRA_SIDEBARS) {
              let targetText = tr(doc, panel.title[0], panel.title[1]);
              for (let btn of shadow.querySelectorAll(`moz-button[view='${panel.view}']`)) {
                if (btn.tooltiptext !== targetText) {
                  btn.removeAttribute("data-l10n-id");
                  btn.removeAttribute("label");
                  btn.tooltiptext = targetText;
                  btn.label = undefined;
                  btn.setAttribute("tooltiptext", targetText);
                }
              }
            }
          }
          updateAll();

          if (!shadow.myObserverInitialized) {
            shadow.myObserverInitialized = true;
            let observer = new win.MutationObserver(() => {
              try { updateAll(); } catch(e) {}
            });
            observer.observe(shadow, { childList: true, subtree: true, attributes: true, attributeFilter: ["view", "tooltiptext", "data-l10n-id"] });
          }
        } catch(e) {}
      }
      win.setInterval(patchSidebarButtons, 500);

      if (sbCtrl) {
        // Make the sidebars getter always include the extra panels
        const originalSidebarsDesc = Object.getOwnPropertyDescriptor(sbCtrl, "sidebars");
        if (originalSidebarsDesc && originalSidebarsDesc.get && !sbCtrl.mySidebarsGetterPatched) {
          sbCtrl.mySidebarsGetterPatched = true;
          Object.defineProperty(sbCtrl, "sidebars", {
            get() {
              let map = originalSidebarsDesc.get.call(this);
              if (map) {
                for (let panel of EXTRA_SIDEBARS) {
                  if (map.has(panel.view)) continue;
                  map.set(panel.view, {
                    icon: panel.icon,
                    url: panel.url,
                    title: tr(doc, panel.title[0], panel.title[1]),
                    ...(panel.l10nId ? { sourceL10nEl: panel.l10nId } : {})
                  });
                }
              }
              return map;
            },
            configurable: true,
            enumerable: true
          });
        }

        // Make getTools include the extra panels
        if (sbCtrl.getTools && !sbCtrl.myGetToolsPatched) {
          sbCtrl.myGetToolsPatched = true;
          const originalGetTools = sbCtrl.getTools;
          sbCtrl.getTools = function() {
            let tools = originalGetTools.call(this);
            if (tools) {
              let toolsPref = prefs.getStringPref("sidebar.main.tools", "");
              for (let panel of EXTRA_SIDEBARS) {
                if (tools.some(t => t.commandID === panel.view)) continue;
                tools.push({
                  commandID: panel.view,
                  view: panel.view,
                  name: panel.name,
                  iconUrl: panel.icon,
                  l10nId: panel.l10nId,
                  // The customize panel uses this as the checkbox label.
                  tooltiptext: tr(doc, panel.title[0], panel.title[1]),
                  disabled: toolsPref ? !toolsPref.split(",").includes(panel.name) : false,
                  hidden: false,
                  attention: false
                });
              }
            }
            return tools;
          };
        }
      }

      // Builds the downloads sidebar's own header (title, close button,
      // search box) and footer ("Clear downloads") — about:downloads has none
      // in a sidebar. Styled by chrome/agent/20-downloads-sidebar.css.
      function injectSearch(sidebarDoc) {
        if (!sidebarDoc || sidebarDoc.location.href !== "about:downloads") return;
        if (sidebarDoc.getElementById("downloads-sidebar-header")) return;

        let rootEl = sidebarDoc.documentElement;
        let header = sidebarDoc.createElementNS("http://www.w3.org/1999/xhtml", "div");
        header.id = "downloads-sidebar-header";

        let titleRow = sidebarDoc.createElementNS("http://www.w3.org/1999/xhtml", "div");
        titleRow.className = "downloads-sidebar-title-row";

        let h4 = sidebarDoc.createElementNS("http://www.w3.org/1999/xhtml", "h4");
        h4.setAttribute("data-l10n-id", "downloads-window");
        titleRow.appendChild(h4);

        let closeBtn = sidebarDoc.createXULElement("toolbarbutton");
        closeBtn.id = "downloads-sidebar-close";
        closeBtn.setAttribute("data-l10n-id", "close-button");
        let img = sidebarDoc.createXULElement("image");
        img.setAttribute("src", "chrome://global/skin/icons/close.svg");
        closeBtn.appendChild(img);
        closeBtn.addEventListener("click", function() {
          try {
            if (sbCtrl) sbCtrl.hide();
          } catch(ex) {}
        });
        titleRow.appendChild(closeBtn);
        header.appendChild(titleRow);

        // Search input inside the header
        let searchContainer = sidebarDoc.createElementNS("http://www.w3.org/1999/xhtml", "div");
        searchContainer.id = "downloads-sidebar-search-container";

        let searchInput = sidebarDoc.createElementNS("http://www.w3.org/1999/xhtml", "input");
        searchInput.type = "search";
        searchInput.setAttribute("data-l10n-id", "downloads-search");
        searchInput.id = "downloads-sidebar-search";
        searchContainer.appendChild(searchInput);
        header.appendChild(searchContainer);

        const filterDownloads = () => {
          try {
            let query = searchInput.value.toLowerCase().trim();
            let list = sidebarDoc.getElementById("downloadsListBox");
            if (!list) return;
            for (let item of list.children) {
              if (item.tagName.toLowerCase() === "richlistitem" && item.classList.contains("download")) {
                let target = item.querySelector(".downloadTarget");
                let text = target ? (target.value || target.textContent) : "";
                if (text.toLowerCase().includes(query)) {
                  item.style.setProperty("display", "", "important");
                } else {
                  item.style.setProperty("display", "none", "important");
                }
              }
            }
          } catch(e) {}
        };

        searchInput.addEventListener("input", filterDownloads);

        rootEl.insertBefore(header, rootEl.firstChild);

        // Keep the filter applied as downloads come and go
        let list = sidebarDoc.getElementById("downloadsListBox");
        if (list) {
          let listObserver = new sidebarDoc.defaultView.MutationObserver(() => {
            filterDownloads();
          });
          listObserver.observe(list, { childList: true });
        }

        // Footer at the bottom
        let footer = sidebarDoc.createElementNS("http://www.w3.org/1999/xhtml", "div");
        footer.id = "downloads-sidebar-footer";

        let clearBtn = sidebarDoc.createElementNS("http://www.w3.org/1999/xhtml", "button");
        clearBtn.id = "downloads-sidebar-clear-btn";
        
        if (sidebarDoc.l10n) {
          sidebarDoc.l10n.formatMessages([{
            id: "downloads-cmd-clear-downloads",
            args: null
          }]).then(msgs => {
            if (msgs && msgs[0] && msgs[0].attributes) {
              let labelAttr = msgs[0].attributes.find(a => a.name === "label");
              if (labelAttr) {
                clearBtn.textContent = labelAttr.value;
              }
            }
          }).catch(e => {
            clearBtn.textContent = tr(sidebarDoc, "Очистить загрузки", "Clear Downloads");
          });
        } else {
          clearBtn.textContent = tr(sidebarDoc, "Очистить загрузки", "Clear Downloads");
        }

        clearBtn.addEventListener("click", function() {
          try {
            let cmd = sidebarDoc.getElementById("downloadsCmd_clearDownloads");
            if (cmd) {
              cmd.doCommand();
            }
          } catch(ex) {}
        });
        footer.appendChild(clearBtn);
        rootEl.appendChild(footer);
      }

      // Builds the add-ons sidebar's UI in a blank page: a compact list of
      // installed extensions with an on/off switch, a search box that filters
      // the list and searches addons.mozilla.org on Enter, and a link to the
      // full page. It is deliberately not about:addons: that page answers
      // Firefox's "is the add-ons manager open?" ping, so "Add-ons and
      // themes" would try to reuse the sidebar instead of opening a tab.
      // Styled by chrome/agent/25-addons-sidebar.css.
      function injectAddonsPanel(sidebarDoc) {
        if (!sidebarDoc || !/^about:blank\?myfox-addons/.test(sidebarDoc.documentURI)) return;
        if (sidebarDoc.getElementById("myfox-addons-panel")) return;

        const sbWin = sidebarDoc.defaultView;
        const HTML = "http://www.w3.org/1999/xhtml";
        const { AddonManager } = win.ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
        // Theme colors and fonts of the browser's own UI.
        let themeCss = sidebarDoc.createElementNS(HTML, "link");
        themeCss.rel = "stylesheet";
        themeCss.href = "chrome://global/skin/global.css";
        sidebarDoc.head.appendChild(themeCss);
        // A blank page doesn't inherit the sidebar's colors; copy them.
        let root = sidebarDoc.documentElement;
        let boxStyle = win.getComputedStyle(doc.getElementById("sidebar-box"));
        let rootStyle = win.getComputedStyle(doc.documentElement);
        root.style.colorScheme = boxStyle.colorScheme;
        root.style.setProperty("--sidebar-text-color", boxStyle.color);
        for (let name of ["--sidebar-background-color", "--toolbar-field-background-color",
            "--toolbar-field-border-color", "--toolbar-field-border-color-focus", "--link-color"]) {
          let val = rootStyle.getPropertyValue(name).trim();
          if (val) root.style.setProperty(name, val);
        }
        const mk = (tag, id, cls) => {
          let e = sidebarDoc.createElementNS(HTML, tag);
          if (id) e.id = id;
          if (cls) e.className = cls;
          return e;
        };

        let panel = mk("div", "myfox-addons-panel");

        let titleRow = mk("div", null, "myfox-addons-title-row");
        let h4 = mk("h4");
        h4.textContent = tr(doc, "Расширения", "Extensions");
        titleRow.appendChild(h4);
        let closeBtn = mk("button", "myfox-addons-close");
        let closeImg = mk("img");
        closeImg.src = "chrome://global/skin/icons/close.svg";
        closeBtn.appendChild(closeImg);
        closeBtn.addEventListener("click", () => {
          try { if (sbCtrl) sbCtrl.hide(); } catch(ex) {}
        });
        titleRow.appendChild(closeBtn);
        panel.appendChild(titleRow);

        let search = mk("input", "myfox-addons-search");
        search.type = "search";
        search.placeholder = tr(doc, "Поиск расширений", "Search add-ons");
        panel.appendChild(search);

        let list = mk("ul", "myfox-addons-list");
        panel.appendChild(list);

        let footer = mk("div", "myfox-addons-footer");
        let manage = mk("button", "myfox-addons-manage");
        manage.textContent = tr(doc, "Управление расширениями", "Manage extensions");
        manage.addEventListener("click", () => {
          try { win.BrowserAddonUI.openAddonsMgr("addons://list/extension"); } catch(ex) {}
        });
        footer.appendChild(manage);
        panel.appendChild(footer);

        const openAmoSearch = (query) => {
          let loc = win.Services.locale.appLocaleAsBCP47;
          win.openTrustedLinkIn(
            "https://addons.mozilla.org/" + loc + "/firefox/search/?type=extension&q=" + encodeURIComponent(query),
            "tab");
        };

        // Per-row "..." menu: one floating element reused for every row.
        let menu = mk("div", "myfox-addons-menu");
        menu.hidden = true;
        panel.appendChild(menu);
        let menuAnchor = null;
        const closeMenu = () => { menu.hidden = true; menuAnchor = null; };
        const openMgr = (view) => {
          try { win.BrowserAddonUI.openAddonsMgr(view); } catch(ex) {}
        };
        function showMenu(addon, anchor) {
          if (!menu.hidden && menuAnchor === anchor) { closeMenu(); return; }
          menu.textContent = "";
          const item = (label, fn, disabled) => {
            let b = mk("button", null, "myfox-menu-item");
            b.textContent = label;
            b.disabled = !!disabled;
            b.addEventListener("click", () => { closeMenu(); fn(); });
            menu.appendChild(b);
          };
          let view = "addons://detail/" + encodeURIComponent(addon.id);
          if (addon.optionsURL) {
            item(tr(doc, "Настройки", "Preferences"), () => openMgr(view + "/preferences"));
          }
          item(tr(doc, "Управление", "Manage"), () => openMgr(view));
          item(tr(doc, "Удалить", "Remove"), () => {
            try { win.BrowserAddonUI.removeAddon(addon.id); } catch(ex) {}
          }, !(addon.permissions & AddonManager.PERM_CAN_UNINSTALL));
          menu.hidden = false;
          menuAnchor = anchor;
          // Under the button, right-aligned; above it if there is no room.
          let r = anchor.getBoundingClientRect();
          let mw = menu.offsetWidth, mh = menu.offsetHeight;
          let vw = sbWin.innerWidth, vh = sbWin.innerHeight;
          let top = r.bottom + 2;
          if (top + mh > vh - 4) top = Math.max(4, r.top - mh - 2);
          menu.style.left = Math.max(4, Math.min(r.right - mw, vw - mw - 4)) + "px";
          menu.style.top = top + "px";
        }
        sidebarDoc.addEventListener("click", ev => {
          if (!menu.hidden && !menu.contains(ev.target) && !ev.target.closest(".myfox-addon-more")) closeMenu();
        }, true);
        sidebarDoc.addEventListener("keydown", ev => { if (ev.key === "Escape") closeMenu(); });
        sbWin.addEventListener("blur", closeMenu);
        list.addEventListener("scroll", closeMenu);

        let renderToken = 0;
        async function render() {
          let token = ++renderToken;
          let addons = (await AddonManager.getAddonsByTypes(["extension"]))
            .filter(a => !a.hidden && !a.isSystem);
          if (token !== renderToken) return;
          // Enabled first, then disabled; each group by name.
          addons.sort((a, b) =>
            (a.userDisabled - b.userDisabled) ||
            a.name.localeCompare(b.name));
          let query = search.value.toLowerCase().trim();
          closeMenu();
          list.textContent = "";
          for (let addon of addons) {
            let li = mk("li", null, "myfox-addon");
            if (addon.userDisabled) li.classList.add("disabled");
            li.hidden = !!query && !addon.name.toLowerCase().includes(query);
            li.dataset.name = addon.name.toLowerCase();

            let icon = mk("img", null, "myfox-addon-icon");
            icon.src = addon.iconURL || "chrome://mozapps/skin/extensions/extensionGeneric.svg";
            li.appendChild(icon);

            let name = mk("span", null, "myfox-addon-name");
            name.textContent = addon.name;
            name.title = addon.name;
            li.appendChild(name);

            let sw = mk("label", null, "myfox-switch");
            let box = mk("input");
            box.type = "checkbox";
            box.checked = !addon.userDisabled;
            box.disabled = !(addon.permissions & AddonManager.PERM_CAN_DISABLE)
              && !(addon.permissions & AddonManager.PERM_CAN_ENABLE);
            box.addEventListener("change", async () => {
              try {
                if (box.checked) await addon.enable(); else await addon.disable();
              } catch(ex) {
                box.checked = !addon.userDisabled;
              }
            });
            sw.addEventListener("click", ev => ev.stopPropagation());
            sw.appendChild(box);
            sw.appendChild(mk("span", null, "myfox-switch-track"));
            li.appendChild(sw);

            let more = mk("button", null, "myfox-addon-more");
            more.title = tr(doc, "Ещё", "More");
            let moreImg = mk("img");
            moreImg.src = "chrome://global/skin/icons/more.svg";
            more.appendChild(moreImg);
            more.addEventListener("click", ev => { ev.stopPropagation(); showMenu(addon, more); });
            li.appendChild(more);

            li.addEventListener("click", () => {
              try { win.BrowserAddonUI.openAddonsMgr("addons://detail/" + encodeURIComponent(addon.id)); } catch(ex) {}
            });
            list.appendChild(li);
          }
          list.hidden = addons.length === 0;
        }

        // "Search on addons.mozilla.org" row, shown while a query is typed.
        let amoRow = mk("button", "myfox-addons-amo");
        amoRow.hidden = true;
        amoRow.addEventListener("click", () => openAmoSearch(search.value.trim()));
        panel.insertBefore(amoRow, footer);

        const applyFilter = () => {
          let query = search.value.toLowerCase().trim();
          for (let li of list.children) {
            li.hidden = !!query && !li.dataset.name.includes(query);
          }
          amoRow.hidden = !query;
          amoRow.textContent = tr(doc,
            "Искать «" + search.value.trim() + "» на addons.mozilla.org",
            "Search “" + search.value.trim() + "” on addons.mozilla.org");
        };
        search.addEventListener("input", applyFilter);
        search.addEventListener("keydown", ev => {
          if (ev.key === "Enter" && search.value.trim()) openAmoSearch(search.value.trim());
        });

        let listener = {};
        for (let ev of ["onEnabled", "onDisabled", "onInstalled", "onUninstalled"]) {
          listener[ev] = () => { render().then(applyFilter).catch(() => {}); };
        }
        AddonManager.addAddonListener(listener);
        sbWin.addEventListener("unload", () => {
          try { AddonManager.removeAddonListener(listener); } catch(ex) {}
        });

        sidebarDoc.body.appendChild(panel);
        render().then(applyFilter).catch(() => {});
      }

      // The password manager sidebar (megalist) is a virtual list: it doesn't
      // measure cards, it sizes the not-yet-rendered chunks from constants
      // hardcoded in its script (215+13px per card). Our CSS makes the card
      // more compact (chrome/agent/60-password-manager.css), so keep the
      // constants in sync — otherwise scrolling jumps on long lists. Done
      // once when the panel loads, no polling.
      function patchMegalistHeights(sbWin) {
        try {
          if (!sbWin || !/megalist/.test(sbWin.document.documentURI)) return;
          sbWin.customElements.whenDefined("password-card").then(() => {
            try {
              let PC = sbWin.customElements.get("password-card");
              PC.DEFAULT_PASSWORD_CARD_HEIGHT = MEGALIST_CARD_HEIGHT;
              PC.WITH_ALERT_PASSWORD_CARD_HEIGHT = MEGALIST_CARD_HEIGHT + MEGALIST_ALERT_EXTRA_HEIGHT;
            } catch(e) {}
          });
        } catch(e) {}
      }

      // Panel-specific patches for the sidebar document: now if one is
      // already loaded, and on every later load (switching panels).
      let sidebar = doc.getElementById("sidebar");
      if (sidebar) {
        try {
          injectSearch(sidebar.contentDocument);
        } catch(e) {}
        try { injectAddonsPanel(sidebar.contentDocument); } catch(e) {}
        try { patchMegalistHeights(sidebar.contentWindow); } catch(e) {}

        sidebar.addEventListener("load", function onSidebarLoad(ev) {
          try {
            injectSearch(sidebar.contentDocument);
          } catch(ex) {}
          try { injectAddonsPanel(sidebar.contentDocument); } catch(ex) {}
          try { patchMegalistHeights(sidebar.contentWindow); } catch(ex) {}
          try {
            win.dispatchEvent(new CustomEvent("sidebar-layout-change"));
          } catch(ex) {}
        }, true);
      }

      if (sbCtrl && !sbCtrl.originalHandleToolbarButtonClick) {
        sbCtrl.originalHandleToolbarButtonClick = sbCtrl.handleToolbarButtonClick;
        sbCtrl.handleToolbarButtonClick = async function() {
          if (this.inSingleTabWindow || this.uninitializing) {
            return;
          }
          if (this.isOpen) {
            this._state.updateVisibility(false);
            this.hide({ dismissPanel: false });
            this.updateToolbarButton();
            return;
          }
          let cmd = this._state.command || this.lastOpenedId || this.DEFAULT_SIDEBAR_ID || "viewHistorySidebar";
          this._state.command = cmd;
          this._state.updateVisibility(true);
          await this.show(cmd);
          this.updateToolbarButton();
        };
      }

      function setupLayoutAndObserver(w, container, box, browser) {
        try {
          function checkAndInjectStyles() {
            try {
              let sidebarMain = container.querySelector("sidebar-main");
              if (sidebarMain && sidebarMain.shadowRoot) {
                if (!sidebarMain.shadowRoot.getElementById("custom-horizontal-styles")) {
                  let style = w.document.createElement("style");
                  style.id = "custom-horizontal-styles";
                  style.textContent = `
                    :host([custom-launcher="true"]) {
                        height: auto !important;
                    }
                    :host([custom-launcher="true"]) .wrapper {
                        display: flex !important;
                        flex-direction: column !important;
                        height: auto !important;
                    }
                    :host([custom-launcher="true"]) .buttons-wrapper {
                        order: -1 !important;
                        display: flex !important;
                        flex-direction: row !important;
                        flex-wrap: wrap !important;
                        align-items: center !important;
                        justify-content: start !important;
                        width: 100% !important;
                        height: auto !important;
                        min-height: auto !important;
                        max-height: none !important;
                        padding: 2px 2px 2px 5px !important;
                        position: relative !important;
                        overflow: visible !important;
                    }
                    :host([custom-launcher="true"]) .actions-list {
                        display: flex !important;
                        flex-direction: row !important;
                        flex-wrap: wrap !important;
                        align-items: center !important;
                        width: 100% !important;
                        height: auto !important;
                        min-height: auto !important;
                        max-height: none !important;
                        padding-left: 0px !important;
                        margin-left: 0px !important;
                        overflow: visible !important;
                    }
                    :host([custom-launcher="true"]) .tools-and-extensions {
                        display: flex !important;
                        flex-direction: row !important;
                        flex-wrap: wrap !important;
                        align-items: center !important;
                        width: 100% !important;
                        height: auto !important;
                        min-height: auto !important;
                        max-height: none !important;
                        padding-left: 0px !important;
                        margin-left: 0px !important;
                        padding-right: 0px !important;
                        overflow: visible !important;
                    }
                    :host([custom-launcher="true"]) .bottom-actions,
                    :host([custom-launcher="true"]) .overflow-button {
                        display: none !important;
                    }
                    :host([custom-launcher="true"]) .buttons-wrapper moz-button,
                    :host([custom-launcher="true"]) .actions-list moz-button {
                        width: 24px !important;
                        height: 24px !important;
                        min-width: 24px !important;
                        min-height: 24px !important;
                        padding: 0 !important;
                        margin: 2px 4px 2px 0px !important;
                        --button-size-icon: 24px !important;
                        --button-min-height: 24px !important;
                        --button-padding-inline: 0px !important;
                        --button-padding: 0px !important;
                        box-sizing: border-box !important;
                    }
                    :host([custom-launcher="true"]) .actions-list > moz-button {
                        --button-outer-padding-block-start: var(--space-xxsmall) !important;
                        --button-outer-padding-block-end: var(--space-xxsmall) !important;
                    }
                    :host([custom-launcher="true"]) slot[name="tabstrip"] {
                        order: 1 !important;
                    }
                    :host([custom-launcher="true"]) splitter {
                        display: none !important;
                    }
                  `;
                  sidebarMain.shadowRoot.appendChild(style);
                }
              }
            } catch(e) {}
          }
          function updateLayout() {
            try {
              checkAndInjectStyles();
              let vertical = prefs.getBoolPref("sidebar.verticalTabs", false);
              let customLayout = prefs.getBoolPref("sidebar.launcherAboveSidebar", false);
              let expandOnHover = false;
              try {
                expandOnHover = (w.SidebarController && w.SidebarController._state && w.SidebarController._state.revampVisibility === "expand-on-hover");
              } catch(e) {}
              
              if (expandOnHover) {
                customLayout = false;
              }

              let sidebarMain = container.querySelector("sidebar-main");

              if (vertical) {
                box.removeAttribute("custom-launcher");
                if (customLayout) {
                  if (sidebarMain) {
                    sidebarMain.setAttribute("custom-launcher", "true");
                  }
                } else {
                  if (sidebarMain) {
                    sidebarMain.removeAttribute("custom-launcher");
                  }
                }
                if (container.parentNode !== browser) {
                  if (observer) observer.disconnect();
                  browser.insertBefore(container, browser.firstChild);
                  if (observer) {
                    observer.observe(browser, { childList: true });
                    observer.observe(box, { childList: true });
                  }
                }
              } else {
                if (customLayout) {
                  box.setAttribute("custom-launcher", "true");
                  if (sidebarMain) {
                    sidebarMain.setAttribute("custom-launcher", "true");
                  }
                  if (container.parentNode !== box) {
                    if (observer) observer.disconnect();
                    box.insertBefore(container, box.firstChild);
                    if (observer) {
                      observer.observe(browser, { childList: true });
                      observer.observe(box, { childList: true });
                    }
                  }
                } else {
                  box.removeAttribute("custom-launcher");
                  if (sidebarMain) {
                    sidebarMain.removeAttribute("custom-launcher");
                  }
                  if (container.parentNode !== browser) {
                    if (observer) observer.disconnect();
                    browser.insertBefore(container, browser.firstChild);
                    if (observer) {
                      observer.observe(browser, { childList: true });
                      observer.observe(box, { childList: true });
                    }
                  }
                }
              }
            } catch(e) {}
          }

          observer = new w.MutationObserver((mutations) => {
            updateLayout();
          });

          updateLayout();
          
          observer.observe(browser, { childList: true });
          observer.observe(box, { childList: true });
          observer.observe(container, { childList: true });

          let prefObserver = {
            observe(subject, topic, data) {
              try {
                updateLayout();
              } catch(e) {}
            }
          };
          prefs.addObserver("sidebar.verticalTabs", prefObserver, false);
          prefs.addObserver("sidebar.launcherAboveSidebar", prefObserver, false);
          prefs.addObserver("sidebar.expandOnHover", prefObserver, false);
          box.addEventListener("sidebar-show", updateLayout);
          w.addEventListener("sidebar-layout-change", updateLayout);

          w.addEventListener("unload", function onUnload() {
            try {
              w.removeEventListener("unload", onUnload);
              if (observer) observer.disconnect();
              prefs.removeObserver("sidebar.verticalTabs", prefObserver);
              prefs.removeObserver("sidebar.launcherAboveSidebar", prefObserver);
              prefs.removeObserver("sidebar.expandOnHover", prefObserver);
              w.removeEventListener("sidebar-layout-change", updateLayout);
            } catch(e) {}
          });
        } catch(e) {}
      }

      let container = doc.getElementById("sidebar-container");
      let box = doc.getElementById("sidebar-box");
      let browser = doc.getElementById("browser");

      if (container && box && browser) {
        setupLayoutAndObserver(win, container, box, browser);
      } else {
        let parentToObserve = doc.getElementById("browser") || doc.documentElement;
        let docObserver = new win.MutationObserver((mutations, obs) => {
          try {
            let c = doc.getElementById("sidebar-container");
            let b = doc.getElementById("sidebar-box");
            let br = doc.getElementById("browser");
            if (c && b && br) {
              obs.disconnect();
              setupLayoutAndObserver(win, c, b, br);
            }
          } catch(e) {}
        });
        docObserver.observe(parentToObserve, { childList: true, subtree: true });
      }

      function registerWidget() {
        try {
          if (CustomizableUI) {
            let widget = CustomizableUI.getWidget("toggle-bookmarks-toolbar-button");
            if (widget && widget.provider !== "api") {
              CustomizableUI.destroyWidget("toggle-bookmarks-toolbar-button");
              widget = null;
            }

            if (!widget) {
              CustomizableUI.createWidget({
                id: "toggle-bookmarks-toolbar-button",
                label: tr(doc, "Панель закладок", "Bookmarks Toolbar"),
                tooltiptext: tr(doc, "Показать/скрыть панель закладок (Ctrl+Shift+B)", "Show/hide bookmarks toolbar (Ctrl+Shift+B)"),
                localized: false,
                onCreated(button) {
                  const win = button.ownerDocument.defaultView;
                  button.setAttribute("class", "toolbarbutton-1 chromeclass-toolbar-additional");
                  button.style.listStyleImage = "url('chrome://browser/skin/places/bookmarksToolbar.svg')";
                  button.style.fill = "currentColor";
                  button.style.mozContextProperties = "fill, fill-opacity, stroke, stroke-opacity";
                  
                  const personalToolbar = button.ownerDocument.getElementById("PersonalToolbar");
                  if (personalToolbar) {
                    button.toggleAttribute("checked", !personalToolbar.collapsed);
                  }
                  
                  button.addEventListener("command", (e) => {
                    const personalToolbar = button.ownerDocument.getElementById("PersonalToolbar");
                    if (personalToolbar) {
                      let currentlyCollapsed = personalToolbar.collapsed;
                      CustomizableUI.setToolbarVisibility("PersonalToolbar", currentlyCollapsed);
                    }
                  });
                }
              });
            }

            function ensurePlacement() {
              try {
                let placement = CustomizableUI.getPlacementOfWidget("toggle-bookmarks-toolbar-button");
                if (!placement) {
                  let position = 1;
                  let areaWidgets = CustomizableUI.getWidgetsInArea(CustomizableUI.AREA_NAVBAR);
                  for (let i = 0; i < areaWidgets.length; i++) {
                    if (areaWidgets[i].id === "sidebar-button") {
                      position = i + 1;
                      break;
                    }
                  }
                  CustomizableUI.addWidgetToArea(
                    "toggle-bookmarks-toolbar-button",
                    CustomizableUI.AREA_NAVBAR,
                    position
                  );
                }
              } catch(e) {}
            }

            whenDelayedStartupDone(win, ensurePlacement);
          }
        } catch(ex) {}
      }

      function setupBookmarksToolbarObserver() {
        try {
          const personalToolbar = doc.getElementById("PersonalToolbar");
          if (!personalToolbar) return;
          
          const updateBtnState = () => {
            const btn = doc.getElementById("toggle-bookmarks-toolbar-button");
            if (btn) {
              btn.toggleAttribute("checked", !personalToolbar.collapsed);
            }
          };
          
          updateBtnState();
          
          const obs = new win.MutationObserver((mutations) => {
            for (let mutation of mutations) {
              if (mutation.attributeName === "collapsed") {
                updateBtnState();
              }
            }
          });
          obs.observe(personalToolbar, {
            attributes: true,
            attributeFilter: ["collapsed"]
          });
          
          win.myBookmarksToolbarObserver = obs;
        } catch(e) {}
      }

      if (CustomizableUI) {
        registerWidget();
      } else {
        win.addEventListener("load", function onLoadWidget() {
          win.removeEventListener("load", onLoadWidget);
          registerWidget();
        });
      }

      whenDelayedStartupDone(win, setupBookmarksToolbarObserver);
    } catch(e) {}

    // Adds two bookmarks-toolbar entries: "Advanced settings" (about:config)
    // and "Add bookmarklets" (the ddblm gallery). Runs AFTER
    // "places-browser-init-complete": by then the bookmarks DB is up and the
    // async import of the default bookmarks is done (on a first start it
    // would wipe (replace:true) whatever we inserted earlier). Idempotent —
    // an existing bookmark is never duplicated; the guard pref is set only
    // once both are in place.
    try {
      globalThis.myfoxAddGalleryBookmarks = () => {
        let wm = Cc["@mozilla.org/appshell/window-mediator;1"].getService(Ci.nsIWindowMediator);
        let win = wm.getMostRecentWindow("navigator:browser");
        if (!win) { return; }
        let pu = win.PlacesUtils;
        if (!pu) { return; }

        // Added ONCE per profile (the flag is set after a successful add):
        // bookmarks the user deleted must not come back on every start.
        let bookmarksDone = prefs.getBoolPref("myfox.galleryBookmarkAdded", false);

        let toolbarGuid = "toolbar_____";
        let addIfMissing = (title, url, index) => {
          return pu.bookmarks.fetch({ url }).then(found => {
            if (!found) {
              return pu.bookmarks.insert({ parentGuid: toolbarGuid, title, url, index });
            }
            return null;
          }).catch(() => null);
        };

        // The gallery is bilingual (client-side ?lang=ru), so a Russian
        // Firefox gets the localized URL from the start.
        let baseGalleryUrl = GALLERY_URL;
        let galleryUrl = tr(win.document, baseGalleryUrl + "?lang=ru", baseGalleryUrl);

        // A bookmark from before the gallery was bilingual points at the base
        // URL — move it to the localized one instead of adding a duplicate.
        let saveGalleryBookmark = () => {
          if (galleryUrl !== baseGalleryUrl) {
            return pu.bookmarks.fetch({ url: baseGalleryUrl }).then(existing => {
              if (existing && existing.parentGuid === toolbarGuid) {
                return pu.bookmarks.update({ guid: existing.guid, url: galleryUrl }).then(() => null);
              }
              return addIfMissing(BOOKMARK_GALLERY_TITLE, galleryUrl, 1);
            }).catch(() => null);
          }
          return addIfMissing(BOOKMARK_GALLERY_TITLE, galleryUrl, 1);
        };

        if (!bookmarksDone && !globalThis.myfoxBookmarksRunning) {
          globalThis.myfoxBookmarksRunning = true;
          let ensureAll = () => addIfMissing(BOOKMARK_ADVANCED_TITLE, "about:config", 0)
            .then(saveGalleryBookmark);
          // On a new profile's first start Places may still be processing the
          // default bookmarks and erase what we just added (that's how
          // about:config used to get lost). So: add right away, check again
          // after 20s, and only when BOTH bookmarks are really there set the
          // "done" flag (otherwise the next start retries). A fresh profile
          // first has its bookmarks toolbar wiped, then the defaults imported
          // (source=RESTORE_ON_STARTUP, ~2-5s after start); we re-add right
          // after that import, or about:config would only show up on the
          // second launch.
          let onImport = (events) => {
            for (let ev of events) {
              if (ev.source === pu.bookmarks.SOURCES.RESTORE_ON_STARTUP) {
                try { pu.observers.removeListener(["bookmark-added"], onImport); } catch(e) {}
                win.setTimeout(() => { try { ensureAll(); } catch(e) {} }, 1500);
                break;
              }
            }
          };
          try { pu.observers.addListener(["bookmark-added"], onImport); } catch(e) {}
          ensureAll().then(() => {
            win.setTimeout(() => {
              try { pu.observers.removeListener(["bookmark-added"], onImport); } catch(e) {}
              ensureAll()
                .then(() => Promise.all([
                  pu.bookmarks.fetch({ url: "about:config" }),
                  pu.bookmarks.fetch({ url: galleryUrl })
                ]))
                .then(([cfg, gal]) => {
                  if (cfg && gal) {
                    try { prefs.setBoolPref("myfox.galleryBookmarkAdded", true); } catch(e) {}
                  }
                })
                .catch(() => {});
            }, 20000);
          }).catch(() => {});
        }

        // Both theme add-ons are installed into the profile regardless of
        // choice (<profile>/extensions/*.xpi — instant switching later);
        // myfox.theme (from user.js, see apply_theme_pref) picks which one
        // gets enabled here. Firefox stores a sideloaded theme in
        // extensions.json with userDisabled=true until addon.enable() is
        // called explicitly — so we enable AND activate. Only ONCE
        // (myfox.themeApplied) and only if the user hasn't since picked a
        // different theme themselves: theme choice is a setting, never
        // overwritten on later startups.
        let themeId = THEME_IDS[prefs.getCharPref("myfox.theme", "dark")] || THEME_IDS.dark;
        try {
          let am = win.AddonManager;
          if (am && !prefs.getBoolPref("myfox.themeApplied", false)) {
            am.getAddonByID(themeId).then(async (addon) => {
              if (addon && addon.type === "theme") {
                let current = prefs.getStringPref("extensions.activeThemeID", "default-theme@mozilla.org");
                if (current === "default-theme@mozilla.org" || current === themeId) {
                  try {
                    if (addon.userDisabled) { await addon.enable(); }
                  } catch(e) {}
                  prefs.setStringPref("extensions.activeThemeID", themeId);
                  try { prefs.clearUserPref("extensions.lastSelectedThemeID"); } catch(e) {}
                }
                prefs.setBoolPref("myfox.themeApplied", true);
              }
            }).catch(() => {});
          }
        } catch(e) {}
      };
    } catch(e) {}

    // Run the bookmarks step when Places finishes initializing...
    try {
      let placesObserver = {
        observe(subject, topic, data) {
          if (topic != "places-browser-init-complete") { return; }
          try { os.removeObserver(placesObserver, topic); } catch(e) {}
          globalThis.myfoxAddGalleryBookmarks();
        }
      };
      os.addObserver(placesObserver, "places-browser-init-complete", false);
      // ...and, as a fallback for when that event already fired before we
      // subscribed, on delayed startup.
      globalThis.listener_myfoxGallery = {
        observe(subject, topic, data) {
          if (topic != "browser-delayed-startup-finished") { return; }
          try { os.removeObserver(globalThis.listener_myfoxGallery, topic); } catch(e) {}
          globalThis.myfoxAddGalleryBookmarks();
        }
      };
      os.addObserver(globalThis.listener_myfoxGallery, "browser-delayed-startup-finished", false);
    } catch(e) {}
  }

  // The extra panels must stay in the sidebar tools list: they hang off it,
  // and whenever Firefox adds any new sidebar panel it rewrites
  // sidebar.main.tools and drops them — so put them back at startup and on
  // every change of the pref.
  try {
    function ensureExtraToolsInPref() {
      let val = prefs.getStringPref("sidebar.main.tools", "");
      if (!val) return;
      let names = val.split(",");
      let missing = EXTRA_SIDEBARS.map(p => p.name).filter(n => !names.includes(n));
      if (missing.length) {
        prefs.setStringPref("sidebar.main.tools", names.concat(missing).join(","));
      }
    }
    ensureExtraToolsInPref();
    if (!globalThis.myExtraToolsObserver) {
      globalThis.myExtraToolsObserver = {
        observe() {
          try {
            ensureExtraToolsInPref();
          } catch(e) {}
        }
      };
      prefs.addObserver("sidebar.main.tools", globalThis.myExtraToolsObserver);
    }
  } catch(e) {}

  // Launcher row above the sidebar: on by default, once.
  oncePerProfile("sidebar.launcherAboveSidebar.initialized", () => {
    prefs.setBoolPref("sidebar.launcherAboveSidebar", true);
  });

  // Core prefs, once: userChrome.css support and the sidebar revamp.
  oncePerProfile("myfox.corePreferencesInitialized", () => {
    prefs.setBoolPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
    prefs.setBoolPref("sidebar.revamp", true);
  });

  // First-run prefs, once per profile (written to the profile's prefs.js, not
  // the install): no about:welcome wizard with "Import from another
  // browser", the website color scheme follows the chosen theme
  // (0 = dark, 1 = light, 2 = system), and so on. A separate guard from the
  // core one, so existing profiles that already have
  // myfox.corePreferencesInitialized still get these.
  oncePerProfile("myfox.firstRunPreferencesInitialized", () => {
    prefs.setBoolPref("browser.aboutwelcome.enabled", false);
    // myfox.theme comes from user.js, pre-seeded by the installer before
    // this profile's first launch (see lib/apply.sh's apply_theme_pref) —
    // absent for profiles that never went through the installer's theme
    // step (browser-only, clean-profile, manually created), where dark
    // stays the default.
    let wantLightTheme = prefs.getCharPref("myfox.theme", "dark") === "light";
    prefs.setIntPref("layout.css.prefers-color-scheme.content-override", wantLightTheme ? 1 : 0);
    // Bookmarks toolbar is always visible (Firefox hides it on regular tabs,
    // showing it only on "newtab"), or a new bookmark/the gallery would seem
    // to vanish as soon as you leave a new tab.
    prefs.setCharPref("browser.toolbars.bookmarks.visibility", "always");

    // One-off starting settings for a fresh profile: AI off, Pocket
    // recommendations/sponsors off, telemetry and marketing banners off,
    // compact UI on. All ordinary user prefs (the same ones Settings and
    // about:config expose) — written once and never overwritten; the user is
    // free to flip any back.
    let freshProfilePrefs = {
      // Compact UI (+ show the density switch in Customize).
      "browser.compactmode.show": true,
      "browser.uidensity": 1,

      // AI — what the "Block AI enhancements" button in "AI controls" does
      // (the global block, each feature, and the prefs underneath).
      "browser.ai.control.default": "blocked",
      "browser.ai.control.sidebarChatbot": "blocked",
      // Translations run locally — keep them (an explicit "enabled": a
      // feature left at "default" would follow the global block).
      "browser.ai.control.translations": "enabled",
      "browser.ai.control.pdfjsAltText": "blocked",
      "browser.ai.control.linkPreviewKeyPoints": "blocked",
      "browser.ai.control.smartTabGroups": "blocked",
      "browser.ai.control.smartWindow": "blocked",
      "browser.ai.control.speechRecognition": "blocked",
      "extensions.ml.enabled": false,
      // browser.ml.enable (the ML engine itself) stays: what we keep on
      // (local translations) uses it; the features are disabled above.
      "browser.ml.chat.enabled": false,
      "browser.ml.chat.menu": false,
      "browser.ml.chat.page": false,
      "browser.ml.chat.shortcuts": false,
      "browser.ml.chat.sidebar": false,
      "browser.ml.linkPreview.enabled": false,
      "browser.tabs.groups.smart.enabled": false,
      "browser.tabs.groups.smart.userEnabled": false,
      "browser.smartwindow.enabled": false,
      "pdfjs.enableAltText": false,

      // Telemetry and reports (the ones listed in Settings > Privacy).
      "datareporting.healthreport.uploadEnabled": false,
      "datareporting.usage.uploadEnabled": false,
      "datareporting.policy.dataSubmissionEnabled": false,
      "toolkit.telemetry.enabled": false,
      "toolkit.telemetry.unified": false,
      "toolkit.telemetry.archive.enabled": false,
      "toolkit.telemetry.server": "data:,",
      "toolkit.telemetry.newProfilePing.enabled": false,
      "toolkit.telemetry.bhrPing.enabled": false,
      "toolkit.telemetry.firstShutdownPing.enabled": false,
      "toolkit.telemetry.shutdownPingSender.enabled": false,
      "browser.newtabpage.activity-stream.feeds.telemetry": false,
      "browser.newtabpage.activity-stream.telemetry": false,
      "browser.search.serpEventTelemetryCategorization.enabled": false,
      "app.shield.optoutstudies.enabled": false,
      "app.normandy.enabled": false,
      "browser.discovery.enabled": false,

      // New tab: recommended stories (formerly Pocket) and sponsors.
      "browser.newtabpage.activity-stream.feeds.section.topstories": false,
      "browser.newtabpage.activity-stream.showSponsored": false,
      "browser.newtabpage.activity-stream.showSponsoredTopSites": false,
    };
    for (let name in freshProfilePrefs) {
      try {
        let val = freshProfilePrefs[name];
        if (typeof val === "boolean") prefs.setBoolPref(name, val);
        else if (typeof val === "number") prefs.setIntPref(name, val);
        else prefs.setStringPref(name, val);
      } catch(e) {}
    }
  });

  // Hook windows that are already open
  let wins = wm.getEnumerator("navigator:browser");
  while (wins.hasMoreElements()) {
    let w = wins.getNext();
    try {
      runOnDOMContentLoaded(w, () => initWindow(w));
    } catch(e) {}
  }

  // Hook future windows, and patch the sidebar customize page (adds the
  // launcher-above-sidebar checkbox and fixes the downloads label)
  globalThis.myWinObserver = {
    observe(subject, topic, data) {
      try {
        if (topic === "chrome-document-global-created") {
          let win = subject;
          
          if (win.location.href === "chrome://browser/content/browser.xhtml") {
            runOnDOMContentLoaded(win, () => initWindow(win));
          }
          
          if (win.location.href === "chrome://browser/content/sidebar/sidebar-customize.html") {
            let originalDefine = win.customElements.define;
            win.customElements.define = function(name, constructor) {
              if (name === "sidebar-customize") {
                let originalUpdated = constructor.prototype.updated;
                constructor.prototype.updated = function(changedProperties) {
                  if (originalUpdated) {
                    originalUpdated.call(this, changedProperties);
                  }
                  try {
                    let shadow = this.shadowRoot;
                    let fieldset = shadow ? shadow.querySelector(".customize-group.no-end-margin") : null;
                    if (fieldset) {
                      let downloadsCheckbox = shadow.querySelector('moz-checkbox[name="downloads"]') || shadow.getElementById("downloads");
                      if (downloadsCheckbox) {
                        downloadsCheckbox.setAttribute("label", tr(this.ownerDocument, "Загрузки", "Downloads"));
                        downloadsCheckbox.removeAttribute("data-l10n-id");
                      }

                      let checkbox = shadow.getElementById("custom-launcher-above-sidebar");
                      if (!checkbox) {
                        checkbox = this.ownerDocument.createElement("moz-checkbox");
                        checkbox.id = "custom-launcher-above-sidebar";
                        checkbox.setAttribute("type", "checkbox");
                        checkbox.setAttribute("name", "launcherAboveSidebar");
                        checkbox.setAttribute("label", tr(this.ownerDocument, "Панель кнопок над сайдбаром", "Show button panel above sidebar"));
                        
                        let vtCheckbox = shadow.getElementById("vertical-tabs");
                        if (vtCheckbox && vtCheckbox.nextSibling) {
                          fieldset.insertBefore(checkbox, vtCheckbox.nextSibling);
                        } else {
                          fieldset.appendChild(checkbox);
                        }
                      }
                      
                      let enabled = prefs.getBoolPref("sidebar.launcherAboveSidebar", false);
                      
                      let expandOnHover = false;
                      try {
                        expandOnHover = this.getWindow().SidebarController._state.revampVisibility === "expand-on-hover";
                      } catch(e) {}
                      
                      checkbox.checked = enabled;
                      checkbox.toggleAttribute("checked", enabled);
                      checkbox.disabled = expandOnHover;
                      checkbox.toggleAttribute("disabled", expandOnHover);
                      
                      if (!checkbox.hasListener) {
                        checkbox.hasListener = true;
                        checkbox.addEventListener("change", (e) => {
                          let checked = e.target.checked;
                          prefs.setBoolPref("sidebar.launcherAboveSidebar", checked);
                          e.target.toggleAttribute("checked", checked);
                          notifyLayoutChange();
                        });
                      }
                    }
                  } catch(ex) {}
                };
              }
              return originalDefine.call(this, name, constructor);
            };
          }
        }
      } catch(e) {}
    }
  };
  
  os.addObserver(globalThis.myWinObserver, "chrome-document-global-created", false);
  
} catch(e) {}
