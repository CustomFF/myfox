name: Release core

on:
  push:
    tags:
      - "core-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload the archive to this run only; don't create a release"
        type: boolean
        default: true
      tag:
        description: "Tag to release (core-<major>.<minor>.<patch>); required unless dry_run"
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GITHUB_TOKEN defaults to read-only; release creation needs write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      RELEASE: ${{ github.event_name == 'push' || !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      # A broken changelog must fail the dry run too, not only a release.
      - name: Check the changelog
        run: python3 scripts/changelog_to_json.py -o /dev/null

      - name: Check the version
        run: |
          if [[ -z "$TAG" ]]; then
            if [[ "$RELEASE" == "true" ]]; then
              echo "::error::a release needs a tag (set the 'tag' input)"
              exit 1
            fi
            exit 0
          fi
          if ! [[ "$TAG" =~ ^core-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not core-<major>.<minor>.<patch>"
            exit 1
          fi
          # The tag, the code's own version and the changelog must agree.
          package=$(python3 scripts/changelog_to_json.py --package-version)
          if [[ "${TAG#core-}" != "$package" ]]; then
            echo "::error::tag $TAG doesn't match myfox/__init__.py's __version__ ($package)"
            exit 1
          fi
          python3 scripts/changelog_to_json.py --check "$package"

      # A broken core must not reach `myfox refresh`.
      - name: Tests
        run: python3 -m unittest discover -t . -s myfox/tests -p "test_*.py"

      - name: Build the archive
        run: ./scripts/build-core-dist.sh build/dist

      - uses: actions/upload-artifact@v7
        with:
          name: myfox-core
          path: build/dist/

      - name: Create the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/changelog_to_json.py --notes "${TAG#core-}" > build/notes.md
          gh release create "$TAG" build/dist/myfox-core.tar.gz build/dist/changelog.json \
            --title "MyFox ${TAG#core-}" \
            --notes-file build/notes.md \
            --target "$GITHUB_SHA" \
            --latest
